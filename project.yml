name: LumenEdit

options:
  bundleIdPrefix: com.lumenedit
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_PREVIEWS: YES
    CODE_SIGN_STYLE: Automatic
    CLANG_ENABLE_MODULES: YES
    ALWAYS_SEARCH_USER_PATHS: NO

targets:
  LumenEdit:
    type: application
    platform: iOS
    sources:
      - path: LumenEdit
        excludes:
          - "Resources/Info.plist"
      # Info.plist 只作为文件引用出现在导航器里，不参与任何 build phase
      - path: LumenEdit/Resources/Info.plist
        buildPhase: none
    settings:
      base:
        PRODUCT_NAME: LumenEdit
        PRODUCT_BUNDLE_IDENTIFIER: com.wokenday77.lumenedit
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: LumenEdit/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        # 免费 Apple ID 签名时由 Xcode 自动选择证书；在 Xcode 里填一次 Team 即可
        # 本机已登录 Personal Team「椒泡」，ID 如下（写在 project.yml 才是持久化的）
        DEVELOPMENT_TEAM: H7XJ2PBZJG
        # 本工程不需要任何 entitlement：相机与相册权限只依赖 Info.plist 里的用途说明

schemes:
  LumenEdit:
    build:
      targets:
        LumenEdit: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
